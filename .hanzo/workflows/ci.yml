# Checks for main and for every pull request into it. The forge runs
# .hanzo/workflows on its own runners; GitHub Actions is off for this repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    runs-on: linux-amd64
    timeout-minutes: 20
    strategy:
      matrix:
        # 22 is the floor package.json names: 22.12 is the first release that
        # require()s an ES module unflagged, and the CommonJS build requires
        # jose, which ships ESM only. 26 is current.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # src/dist.test.ts reads the build, so this comes after it.
      - run: pnpm test

  go:
    runs-on: linux-amd64
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      # The module has no dependencies, so there is no go.sum to key a cache on.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - run: go vet ./...
      - run: go test ./...
