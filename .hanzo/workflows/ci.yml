name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: hanzo-build-linux-amd64
    strategy:
      matrix:
        # Node 20 is EOL (2026-04-30) and GitHub Actions deprecated it.
        # 22 = active LTS (matches the publish workflow), 24 = current.
        # `node --test` recursive `**` globs require Node >= 21, so the
        # quoted-glob test script (package.json) needs a >= 21 floor in CI.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm build

      - run: pnpm test
